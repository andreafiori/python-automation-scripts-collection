[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-file-management"
description = "A collection of Python file management utilities"
version = "0.1.0"
dependencies = ["cryptography>=42.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]